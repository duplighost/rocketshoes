  </g>
  <circle cx="600" cy="405" r="270" fill="#7ce9ff" opacity=".12" filter="url(#glow)"/>
  <circle cx="600" cy="405" r="242" fill="url(#moon)"/>
  <circle cx="600" cy="405" r="242" fill="url(#rim)"/>
  <g fill="#273049" opacity=".38">
