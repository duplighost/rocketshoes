<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Spiggot Moonfeel</title>
  <desc id="desc">A tiny figure running around a glowing cratered moon in violet space.</desc>
  <defs>
    <radialGradient id="space" cx="48%" cy="30%" r="80%">
      <stop offset="0" stop-color="#42305c"/>
      <stop offset=".55" stop-color="#111427"/>
      <stop offset="1" stop-color="#05060b"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="34%" r="62%">
      <stop offset="0" stop-color="#fff8ce"/>
      <stop offset=".42" stop-color="#b9d6d7"/>
      <stop offset=".82" stop-color="#536684"/>
      <stop offset="1" stop-color="#1b213a"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="48%" r="50%">
      <stop offset=".65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7ce9ff" stop-opacity=".38"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
